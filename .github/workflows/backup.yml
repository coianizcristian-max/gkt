name: Database Backup

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Backup via Supabase REST API
        env:
          SUPABASE_URL: https://kaqgpdbojawjbssqrtoh.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M)
          mkdir -p backup_${TIMESTAMP}

          # Lista delle tabelle da esportare
          TABLES=(
            allenamenti valutazioni portieri profili stagioni squadre
            partite valutazioni_partita ricorrenze_stagionali stagione_categorie
            abbonamenti coupon coupon_utilizzi esercizi allenamento_esercizi
            obiettivi portiere_tag versioni versioni_viste
            attributi_esercizio esercizio_attributi anni_stagione
          )

          for TABLE in "${TABLES[@]}"; do
            echo "Esportando $TABLE..."
            curl -s \
              "${SUPABASE_URL}/rest/v1/${TABLE}?select=*&limit=10000" \
              -H "apikey: ${SUPABASE_SERVICE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
              -o "backup_${TIMESTAMP}/${TABLE}.json" || echo "Tabella $TABLE non trovata, skip"
          done

          # Comprimi tutto
          tar -czf "gkt_backup_${TIMESTAMP}.tar.gz" "backup_${TIMESTAMP}/"
          rm -rf "backup_${TIMESTAMP}/"
          echo "Backup completato: gkt_backup_${TIMESTAMP}.tar.gz"

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_number }}
          path: "*.tar.gz"
          retention-days: 30
